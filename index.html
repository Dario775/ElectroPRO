<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ElectroPro - Cálculos Eléctricos y Auditoría</title>
    <meta name="description" content="Herramienta profesional para electricistas: cálculo de consumo mensual, amperaje, factor de potencia, balanceo de fases y reportes PDF para clientes." />
    <meta property="og:title" content="ElectroPro - Cálculos Eléctricos y Auditoría" />
    <meta property="og:description" content="Herramienta profesional para electricistas: cálculo de consumo mensual, amperaje, factor de potencia, balanceo de fases y reportes PDF para clientes." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Fija el tema antes del primer pintado para que no se vea un destello
      // del tema equivocado al abrir la aplicación.
      (function () {
        try {
          var stored = localStorage.getItem('electropro_theme_v1');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersLight ? 'light' : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
